org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# --- AGP 9 + KSP 조합에 필요한 설정 -----------------------------------------
# Hilt(그리고 Phase 2 의 Room)는 KSP 를 쓰는데, KSP 는 아직 AGP 9 의
# built-in Kotlin / new DSL 과 호환되지 않는다. 따라서 둘 다 끄고
# org.jetbrains.kotlin.android 플러그인을 명시 적용한다.
# KSP 가 AGP 9 new DSL 을 지원하면 이 두 줄을 지우고 built-in Kotlin 으로 이전한다.
android.builtInKotlin=false
android.newDsl=false
